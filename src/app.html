<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover : l'app occupe tout l'écran de l'iPhone (encoche, barre d'accueil gérées en CSS). -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="description" content="Vos fiches chiffrées de bout en bout." />
		<!-- PWA : manifest généré au build, réglages propres à iOS. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- ?v= : force le rafraîchissement, les navigateurs gardent les favicons dans un cache à part. -->
		<link rel="icon" type="image/png" href="/favicon-48x48.png?v=2" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Stash" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d232a" />
		<!-- Thème choisi appliqué avant l'affichage (bloquant à dessein). -->
		<script src="/theme.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="app-root">%sveltekit.body%</div>
	</body>
</html>
