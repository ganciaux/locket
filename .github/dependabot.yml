# Une fois par semaine : propose les mises à jour npm. Les versions mineures et correctives de développement sont
# regroupées ; chaque version majeure arrive dans sa propre PR, à traiter (ou fermer) sans bloquer les autres.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
